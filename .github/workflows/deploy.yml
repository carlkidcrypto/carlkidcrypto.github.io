name: Deploy Sphinx to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/updates
      - 'feature/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_sphinx_build.yml@14e025f6c182b7b20718538f533ca467a9ff9c6c
    with:
      docs-dir: '.'
      requirements-file: 'requirements.txt'
      output-dir: '_build/html'
      pre-build-cmd: 'if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then python3 .github/scripts/stamp_blog_dates.py --auto; fi'
      blog-audit-script: '.github/scripts/audit_blog_posts.py'
      deploy-pages: true
