name: Deploy Sphinx to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/updates
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install documentation requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Stamp blog publication date on merge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python3 .github/scripts/stamp_blog_dates.py --auto
          if [ -n "$(git status --porcelain source/blog/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add source/blog/
            git commit -m "chore(blog): auto-stamp publication date on merge [skip ci]"
            git push origin main
          else
            echo "No publication dates to update."
          fi

      - name: Build Sphinx website
        run: |
          make html SPHINXOPTS="-W"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
